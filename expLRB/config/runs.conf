# ============================================================================
# expLRB run matrix — source of truth for macros, cluster submits, and plot.C.
#
# Edit this file, then run:  scripts/gen_macros.sh
#   -> regenerates config/macros/<scenario>.mac
#      config/macros/manifest.tsv
#      config/plot_scenarios.inc
#
# Syntax
#   [type:name]        a named profile: beam | geometry | materials | sample |
#                      physics | scoring | run | scenario
#   key = value        a field (scalar keys keep the last value)
#   layer = ...        repeated keys keep their order (geometry only)
#   create/add = ...   repeated keys keep their order (materials only)
#   Comments are whole-line only: a line whose first non-space char is '#'.
#
# A [scenario:...] references profiles and may override run/beam/output fields.
# See RUNNING.md for a worked example.
# ============================================================================

# --- Beam -------------------------------------------------------------------
[beam:ne20_1gev]
particle = ion
ion = 10 20 10
energy = 1.0 GeV
radius = 7 mm

[beam:ne20_800mev]
particle = ion
ion = 10 20 10
energy = 800 MeV

# --- Geometry (world + tract layers) ----------------------------------------
[geometry:with_filter]
world-z = 10 cm
layer = 14 14 0.004 mm G4_Ta 0 0 0.00020 cm
layer = 14 14 0.003 mm G4_Fe 0 0 0.00055 cm
layer = 14 14 0.005 mm G4_Al 0 0 0.00095 cm
layer = 14 14 6.000 mm G4_AIR 0 0 0.30120 cm
layer = 14 14 0.005 mm G4_Al 0 0 0.60145 cm
layer = 14 14 6.000 mm G4_AIR 0 0 0.90170 cm
layer = 14 14 0.005 mm G4_Al 0 0 1.20195 cm
layer = 14 14 1.815 mm G4_Al 0 0 1.29295 cm
layer = 14 14 10.00 mm G4_AIR 0 0 1.88370 cm
layer = 14 14 1.200 mm G4_POLYETHYLENE 0 0 2.44370 cm

[geometry:no_filter]
world-z = 10 cm
layer = 14 14 0.004 mm G4_Ta 0 0 0.00020 cm
layer = 14 14 0.003 mm G4_Fe 0 0 0.00055 cm
layer = 14 14 0.005 mm G4_Al 0 0 0.00095 cm
layer = 14 14 6.000 mm G4_AIR 0 0 0.30120 cm
layer = 14 14 0.005 mm G4_Al 0 0 0.60145 cm
layer = 14 14 6.000 mm G4_AIR 0 0 0.90170 cm
layer = 14 14 0.005 mm G4_Al 0 0 1.20195 cm
layer = 14 14 11.815 mm G4_AIR 0 0 1.79295 cm
layer = 14 14 1.200 mm G4_POLYETHYLENE 0 0 2.44370 cm

[geometry:dedx]
world-z = 100 mm

# --- Custom materials (NIST materials such as G4_WATER need no definition) ---
[materials:cells]
create = Nucleus 1.0 g/cm3 5
add = G4_H 0.3545
add = G4_O 0.1518
add = G4_C 0.2912
add = G4_N 0.1899
add = G4_P 0.0126
create = Cytoplasm 1.0 g/cm3 5
add = G4_H 0.5942
add = G4_O 0.2437
add = G4_C 0.1118
add = G4_N 0.0403
add = G4_P 0.0100
create = Membrane 1.1 g/cm3 4
add = G4_H 0.4000
add = G4_O 0.2000
add = G4_C 0.2000
add = G4_N 0.2000
create = RPMI_1640 1.0145 g/cm3 10
add = O 0.8653
add = H 0.1098
add = C 0.0121
add = Cl 0.0048
add = Na 0.0045
add = N 0.0028
add = P 0.0002
add = S 0.0002
add = K 0.0002
add = Ca 0.0001

[materials:none]

# --- Samples (biolayer) -----------------------------------------------------
# cells = 0 -> continuous medium (no cell spheres, no /bio/cell/* commands)
[sample:monolayer_cells]
material = RPMI_1640
cells = 186000
size = 14 14 0.015 mm
pos = 0 0 2.50445 cm
cell-geometry = 3.1 0.5 0.01 um
cell-materials = Nucleus Cytoplasm Membrane
cell-densities = 1.0 1.0 1.1 g/cm3
cell-physics = DNA_Opt6
layer-physics = none
score-target = nucleus
memory = 4000
disk = 4000

[sample:monolayer_nocells]
material = RPMI_1640
cells = 0
size = 14 14 0.015 mm
pos = 0 0 2.50445 cm
layer-physics = DNA_Opt6
score-target = medium
memory = 1500
disk = 2000

[sample:suspension_cells]
material = RPMI_1640
cells = 905000
size = 14 14 4 mm
pos = 0 0 2.70370 cm
cell-geometry = 3.1 0.5 0.01 um
cell-materials = Nucleus Cytoplasm Membrane
cell-densities = 1.0 1.0 1.1 g/cm3
cell-physics = DNA_Opt6
layer-physics = none
score-target = nucleus
memory = 8000
disk = 4000

[sample:suspension_nocells]
material = RPMI_1640
cells = 0
size = 14 14 4 mm
pos = 0 0 2.70370 cm
layer-physics = DNA_Opt6
score-target = medium
memory = 2000
disk = 2000

[sample:dedx_water]
material = G4_WATER
cells = 0
size = 14 14 0.010 mm
pos = 0 0 0 mm
layer-physics = DNA_Opt6
score-target = medium
memory = 1000
disk = 1000

[sample:dedx_water_em]
material = G4_WATER
cells = 0
size = 14 14 0.010 mm
pos = 0 0 0 mm
layer-physics = none
score-target = medium
memory = 1000
disk = 1000

# --- Physics ----------------------------------------------------------------
[physics:had]
hadronic = QGSP_BIC_HP
hadronic-enabled = true
em = EM_Opt4
dna-activator = true

[physics:nohad]
hadronic = none
hadronic-enabled = false
em = EM_Opt4
dna-activator = true

[physics:had_nodna]
hadronic = QGSP_BIC_HP
hadronic-enabled = true
em = EM_Opt4
dna-activator = false

# --- Scoring profiles (must exist in include/ScoringProfile.hh) --------------
[scoring:standard]
profile = standard

[scoring:minimal]
profile = minimal

[scoring:full]
profile = full

# --- Run scale --------------------------------------------------------------
# print-progress is derived automatically from `events` (~500 lines, never finer
# than every 10 events); override with `print-progress = N` or `progress-lines = M`.
[run:production]
events = 1000000
threads = 10

[run:validation]
events = 1000
threads = 2

[run:smoke]
events = 50
threads = 4

# --- Scenarios (the generated macro matrix) ---------------------------------
[scenario:monolayer_filt_cells_had]
geometry = with_filter
materials = cells
sample = monolayer_cells
physics = had
scoring = standard
run = production
beam = ne20_1gev
label = Monolayer, filter, cells, hadronic

