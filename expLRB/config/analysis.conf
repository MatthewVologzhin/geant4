# ============================================================================
# expLRB plot.C cosmetic overrides (optional).
#
# Read by plot.C at startup; unknown keys are reported and ignored. Any key
# left out keeps the built-in default. This file only tunes presentation and
# output paths — it never substitutes or fabricates data.
#
#   output-dir        directory for saved plot images
#   output-root-file  aggregated analysis ROOT file
#   output-csv-file   dosimetric audit CSV
#   image-format      svg | pdf | png
#   norm-primaries    primaries used to normalise per-primary plots
#   norm-label        axis/legend label for the normalisation
# ============================================================================

output-dir       = output/plots/analysis
output-root-file = output/plots/analysis/lrb_analysis_results.root
output-csv-file  = output/plots/analysis/lrb_dosimetric_audit.csv
image-format     = pdf
norm-primaries   = 1e6
norm-label       = 10^{6} primaries
