# Geant4 installation used by expLRB.
#
# Switch the internal Geant4 version by editing GEANT4_PREFIX below,
# or by exporting GEANT4_PREFIX / GEANT4_VERSION_NAME before running scripts/build.sh.
# scripts/build.sh sources this file and reconfigures automatically when the prefix changes.

GEANT4_VERSION_NAME="${GEANT4_VERSION_NAME:-geant4-v11.4-ref01}"
GEANT4_PREFIX="${GEANT4_PREFIX:-/home/mvologzhin/programms/${GEANT4_VERSION_NAME}/install}"

export GEANT4_VERSION_NAME
export GEANT4_PREFIX
