# Geant4 installation used by expLRB (sourced by scripts/build.sh and jobs/job_run_one.sh).
#
# Resolution order (first install containing bin/geant4.sh wins); env overrides all:
#   1. $GEANT4_PREFIX                      (explicit override, highest priority)
#   2. $GEANT4_VERSION_NAME (default geant4-11.4-ref09), then a few known 11.4 names
#      under $HOME/programms and /home/mvologzhin/programms
# This keeps one committed file working on the cluster (multiple 11.4 installs) and on
# WSL2 (geant4-v11.4-ref01) without editing it back and forth.
#
# NOTE: a login shell may have another Geant4 (e.g. 11.5-beta) in PATH/LD_LIBRARY_PATH;
# scripts/build.sh and jobs/job_run_one.sh source this file and then $GEANT4_PREFIX/bin/geant4.sh,
# which prepends the intended 11.4 libs/commands ahead of any leftover ones.

GEANT4_VERSION_NAME="${GEANT4_VERSION_NAME:-geant4-11.4-ref09}"

if [[ -z "${GEANT4_PREFIX:-}" ]]; then
  for _g4name in "$GEANT4_VERSION_NAME" \
                  geant4-11.4-ref09 geant4-11.4-ref08 geant4-11.4-ref02 geant4-11.4-ref01 \
                  geant4-v11.4-ref01; do
    for _g4base in "$HOME/programms" "/home/mvologzhin/programms"; do
      if [[ -f "$_g4base/$_g4name/install/bin/geant4.sh" ]]; then
        GEANT4_PREFIX="$_g4base/$_g4name/install"; break 2
      fi
    done
  done
  unset _g4name _g4base
fi
GEANT4_PREFIX="${GEANT4_PREFIX:-$HOME/programms/${GEANT4_VERSION_NAME}/install}"

export GEANT4_VERSION_NAME
export GEANT4_PREFIX
