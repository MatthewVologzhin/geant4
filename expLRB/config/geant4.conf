# Geant4 installation used by expLRB (sourced by scripts/build.sh and jobs/job_run_one.sh).
#
# Resolution order (first existing directory wins); anything can be overridden by env:
#   1. $GEANT4_PREFIX              (explicit override, highest priority)
#   2. known cluster install       (/home/mvologzhin/programms/geant4-11.4-ref09/install)
#   3. known WSL install           ($HOME/programms/geant4-11.4-ref09/install)
#   4. $HOME/programms/$GEANT4_VERSION_NAME/install   (default name: geant4-v11.4-ref01)
# This keeps one committed file working on both the HPC login node (ref09) and WSL2 (ref01)
# without editing it back and forth. Set GEANT4_PREFIX explicitly to force a version.

GEANT4_VERSION_NAME="${GEANT4_VERSION_NAME:-geant4-v11.4-ref01}"

if [[ -z "${GEANT4_PREFIX:-}" ]]; then
  for _g4d in \
      "/home/mvologzhin/programms/geant4-11.4-ref09/install" \
      "$HOME/programms/geant4-11.4-ref09/install" \
      "$HOME/programms/${GEANT4_VERSION_NAME}/install"; do
    if [[ -d "$_g4d" ]]; then GEANT4_PREFIX="$_g4d"; break; fi
  done
  unset _g4d
fi
GEANT4_PREFIX="${GEANT4_PREFIX:-$HOME/programms/${GEANT4_VERSION_NAME}/install}"

export GEANT4_VERSION_NAME
export GEANT4_PREFIX
